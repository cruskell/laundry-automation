[package]
name = "laundry-automation"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
url = "2"

percent-encoding = "2"
progenitor-client = "=0.11.2"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
regress = "=0.10.4"
tokio = { version = "1", features = ["rt", "net", "time"] }

[build-dependencies]
progenitor = { version = "=0.11.2", default-features = false }
serde_json = "1"
serde_yaml = "0.9"
syn = "2"
prettyplease = "0.2"
heck = "0.5"
