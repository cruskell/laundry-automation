      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCourseRegisterRequest'
      x-cli-operations:
      - variant: RegisterCourse
        name: register-course
        appliance: true
        request_schema: CourseAddRequest
      - variant: EditCourse
        name: edit-course
        appliance: true
        request_schema: CourseEditRequest
      - variant: DeleteCourse
        name: delete-course
        appliance: true
        request_schema: CourseDeleteRequest
