      parameters:
      - name: language
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: from_index
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: X-ApplianceId
        in: header
        required: false
        schema:
          type: string
          minLength: 1
      x-cli-operations:
      - variant: Notices
        name: notices
      - variant: Notice
        name: notice
        appliance: true
        lookup: notice
        extra_params:
        - name: id
          in: local
          required: true
          schema:
            type: string
            minLength: 1
        only_params:
        - id
      description: from_index is used by the official app. offset is retained as an unverified compatibility
        parameter. CLI notice details are a local lookup, not GET /notices/{id}.
  /laundry/v5/notices/{id}:
