openapi: 3.0.3
info:
  title: Panasonic SmartLaundry API (community-maintained)
  version: 5.0.1
  description: 'Derived from s-zaizen/panasonic-smartlaundry-api (license: spec/LICENSE), corrected
    against official FY26_2nd main.d8aa4ffb.js source map and authenticated responses. Independent
    project; not an official Panasonic contract. Unknown fields are retained; response shape evidence
    is model-specific. Writes have not been executed against production.'
  x-source-map-sha256: 28e1fc15b6781fb7c722b33afb5c9a47489928b5d8304460d8e1d97f4ac3ea1f
servers:
- url: https://app.wad.apws.panasonic.com
  description: Observed production origin
security:
- bearerAuth: []
x-client-headers:
  User-Agent: laundry-automation/<version>
  Content-Language: ja_JP
  X-Timestamp: YYYYMMDDHHmmss+0900
  Cookie: atkn=<access_token>
paths:
  /laundry/v5/users:
    post:
      operationId: getOrLoginUser
      summary: Fetch current user or perform login
      x-verification: production-read
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      x-cli-operations:
      - variant: Login
        name: login
      - variant: UserInfo
        name: user-info
        generated_body:
          type: 0
      - variant: NotificationTerminals
        name: notification-terminals
        generated_body:
          type: 0
        projection: notification_term_ids
      description: type=0 verified as user info retrieval. type=1 source-confirmed login, not production-tested.
        Bearer authentication is required.
  /laundry/v5/user:
    post:
      operationId: updateUser
      summary: Update user information
      x-verification: source-and-mock
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      x-cli-operations:
      - variant: UpdateUser
        name: update-user
  /laundry/v5/user/devices:
    get:
      operationId: getUserDevices
      summary: Get registered appliances
      x-verification: production-read
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeviceListResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-ApplianceId
        in: header
        required: false
        schema:
          type: string
          minLength: 1
    post:
      operationId: registerDevice
      summary: Register or update an appliance
      x-verification: source-and-mock
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      x-cli-operations:
      - variant: RegisterDevice
        name: register-device
  /laundry/v5/user/devices/remove:
    post:
      operationId: removeDevice
      summary: Remove registered appliances
      x-verification: source-and-mock
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRemovalRequest'
      x-cli-operations:
      - variant: RemoveDevice
        name: remove-device
        appliance: true
        generated_body:
          appliance_ids:
          - $appliance_id
  /laundry/v5/device/status:
    get:
      operationId: getDeviceStatus
      summary: Fetch appliance status
      x-verification: production-read
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-ApplianceId
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-Cached
        in: header
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: X-VerifyAppliance
        in: header
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
  /laundry/v5/device/info:
    get:
      operationId: getDeviceInfo
      summary: Fetch model capabilities
      x-verification: production-read
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfoResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: product_number
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: com_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
  /laundry/v5/device/control:
    post:
      operationId: controlDevice
      summary: Read or write ECHONET properties
      x-verification: production-read
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceControlResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-ApplianceId
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceControlRequest'
      x-cli-operations:
      - variant: ControlRead
        name: control-read
        request_schema: ControlReadEnvelope
      - variant: ControlWrite
        name: control-write
        request_schema: ControlWriteEnvelope
      description: Read type 03 verified; write type 02 mock-tested. API supports start 00B2=41;
        generic CLI write rejects it and requires guarded start. Result must match appliance/type/sequence
        with cmd_result=true and both status codes 200. No CLI-specific one-appliance limit is asserted
        as an API restriction.
  /laundry/v5/laundry/command:
    post:
      operationId: getLaundryCommandMetadata
      summary: Fetch course command metadata (not a control write)
      x-verification: production-read
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaundryCommandResponse'
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaundryCommandRequest'
      x-cli-operations:
      - variant: CommandDetails
        name: command-details
  /laundry/v5/device/menuitem:
    get:
      operationId: getDeviceMenuItems
      summary: Fetch purchase-region and shop-category choices
      x-verification: production-read
      responses:
        '200':
