          minLength: 1
      - name: base_course
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      x-cli-operations:
      - variant: CustomerCourses
        name: customer-courses
    post:
      operationId: updateCustomerCourses
      summary: Add, edit, or delete customer courses
      x-verification: source-and-mock
      responses:
        '200':
          description: Successful HTTP result; see schema and command-specific status fields.
